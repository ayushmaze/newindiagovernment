<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-label="The Citizen's Press badge">
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Inner circle -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#1a1a1a" stroke-width="0.75"/>

  <!-- Outer ring text: THE CITIZEN'S PRESS -->
  <defs>
    <path id="top-arc" d="M 60,60 m -50,0 a 50,50 0 1,1 100,0"/>
    <path id="bottom-arc" d="M 60,60 m -50,0 a 50,50 0 0,0 100,0"/>
  </defs>
  <text font-family="sans-serif" font-size="8.5" font-weight="700" fill="#1a1a1a" letter-spacing="3.5" text-anchor="middle">
    <textPath href="#top-arc" startOffset="50%">THE CITIZEN&apos;S PRESS</textPath>
  </text>
  <text font-family="sans-serif" font-size="7" font-weight="500" fill="#1a1a1a" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#bottom-arc" startOffset="50%">NEW DELHI · MUMBAI · BENGALURU</textPath>
  </text>

  <!-- Center icon: simplified Ashoka Chakra spokes -->
  <circle cx="60" cy="60" r="14" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="60" cy="60" r="3" fill="#1a1a1a"/>
  <!-- 12 spokes -->
  <g stroke="#1a1a1a" stroke-width="0.8">
    <line x1="60" y1="47" x2="60" y2="57"/>
    <line x1="60" y1="63" x2="60" y2="73"/>
    <line x1="47" y1="60" x2="57" y2="60"/>
    <line x1="63" y1="60" x2="73" y2="60"/>
    <line x1="50.8" y1="50.8" x2="57.8" y2="57.8"/>
    <line x1="62.2" y1="62.2" x2="69.2" y2="69.2"/>
    <line x1="69.2" y1="50.8" x2="62.2" y2="57.8"/>
    <line x1="57.8" y1="62.2" x2="50.8" y2="69.2"/>
    <line x1="50.8" y1="55" x2="57" y2="58.8"/>
    <line x1="63" y1="61.2" x2="69.2" y2="65"/>
    <line x1="55" y1="50.8" x2="58.8" y2="57"/>
    <line x1="61.2" y1="63" x2="65" y2="69.2"/>
  </g>

  <!-- Decorative dots at 3 points representing Truth · Transparency · Voice -->
  <circle cx="60" cy="30" r="2.5" fill="#1a1a1a"/>
  <circle cx="82.5" cy="82.5" r="2.5" fill="#1a1a1a"/>
  <circle cx="37.5" cy="82.5" r="2.5" fill="#1a1a1a"/>

  <!-- Est. text -->
  <text x="60" y="90" font-family="sans-serif" font-size="5.5" fill="#1a1a1a" text-anchor="middle" letter-spacing="2">ESTD 2026</text>
</svg>
